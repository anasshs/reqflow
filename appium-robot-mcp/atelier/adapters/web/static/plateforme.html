<script>
  /* thème avant le premier rendu (évite le flash) : choix mémorisé, sinon préférence du système */
  (function () {
    var t = null;
    try { t = localStorage.getItem("atelier-theme"); } catch (e) { /* stockage indisponible */ }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
